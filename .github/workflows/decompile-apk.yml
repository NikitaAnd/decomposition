name: Decompile APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag"
        required: true
        default: "d"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir work
          APK="$(find work -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decode APK resources with Apktool
        run: |
          mkdir -p output/apktool
          apktool d "$APK" -o output/apktool --force

      - name: Decompile DEX with JADX
        run: |
          mkdir -p output/jadx
          JADX_VERSION=1.5.2
          curl -fL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx

          set +e
          ./jadx/bin/jadx --deobf --show-bad-code -d output/jadx "$APK"
          JADX_EXIT=$?
          set -e

          echo "JADX exit code: $JADX_EXIT" | tee output/jadx/JADX_STATUS.txt
          echo "JADX can report decompilation errors for individual classes while still producing useful source output." >> output/jadx/JADX_STATUS.txt

          if [ "$JADX_EXIT" -ne 0 ]; then
            echo "WARNING: JADX finished with errors; preserving all generated output."
          fi

      - name: Extract APK metadata
        run: |
          mkdir -p output/metadata
          unzip -l "$APK" > output/metadata/apk-file-list.txt
          sha256sum "$APK" > output/metadata/apk-sha256.txt
          cp output/apktool/AndroidManifest.xml output/metadata/AndroidManifest.xml || true

      - name: Upload decompilation
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-apk
          path: output/
          retention-days: 7
